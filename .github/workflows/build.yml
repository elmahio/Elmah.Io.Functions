name: build

on:
  push:
    branches: [ main, apiv4 ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Check vulnerable NuGet packages
      uses: elmahio/github-check-vulnerable-nuget-packages-action@v2
      with:
        projects: src/Elmah.Io.Functions/Elmah.Io.Functions.csproj

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack
      run: dotnet pack --configuration Release src/Elmah.Io.Functions/Elmah.Io.Functions.csproj /p:Version=6.0.${{ github.run_number }}-pre

    - name: Install dotnet-validate
      run: dotnet tool install --global dotnet-validate --version 0.0.1-preview.537

    - name: Validate
      run: dotnet-validate package local src/Elmah.Io.Functions/bin/Release/Elmah.Io.Functions.6.0.${{ github.run_number }}-pre.nupkg

    - name: Push to nuget.org
      run: dotnet nuget push src/Elmah.Io.Functions/bin/Release/Elmah.Io.Functions.6.0.${{ github.run_number }}-pre.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      if: ${{ github.event_name == 'push' }}

    - name: Refresh Bugster
      uses: elmahio/actions/refresh-bugster-repository@v1.2
      with:
        signing: ${{ secrets.BUGSTER_SIGNING_KEY }}
        url: ${{ secrets.FUNCTION_APP_URL }}
        repository: ${{ github.event.repository.name }}
      if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}